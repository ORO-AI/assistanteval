[project]
name = "assistanteval"
version = "0.1.0"
description = "A verifiable benchmark for personal AI assistants"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "tasks/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.20",  # harbor 0.24 (litellm) needs <3
    "pydantic>=2.13.5,<2.14",  # tests/parity goldens hold its error text
    "uvicorn>=0.40",
]

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]

[project.scripts]
assistanteval = "assistanteval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistanteval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "harbor==0.24.0",
    "mcp==2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.14",
]
