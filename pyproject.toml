[project]
name = "assistanteval"
version = "0.1.0"
description = "A verifiable benchmark for personal AI assistants"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "tasks/LICENSE"]
authors = [{ name = "ORO AI" }]
requires-python = ">=3.12"
keywords = ["benchmark", "evaluation", "ai-agents", "llm", "mcp", "harbor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.20",  # harbor 0.24 (litellm) needs <3
    "pydantic>=2.13.5,<2.14",  # tests/parity goldens hold its error text
    "uvicorn>=0.40",
]

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]

[project.urls]
Homepage = "https://assistanteval.com"
Repository = "https://github.com/ORO-AI/assistanteval"

[project.scripts]
assistanteval = "assistanteval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistanteval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "harbor==0.24.0",
    "mcp==2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.14",
]
